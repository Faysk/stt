[project]
name = "faysk-tts"
version = "0.1.0"
description = "Public transcription lab with local inference and private browser sessions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20",
    "faster-whisper>=1.2,<2",
    "yt-dlp[default]>=2026.3",
    "psutil>=6",
    "httpx>=0.28",
    "python-dotenv>=1",
    "av>=11,<17",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
]
  # faster-whisper 1.2 uses av.open(metadata_errors=...), removed by PyAV 17+.

[dependency-groups]
dev = ["pytest>=8"]
