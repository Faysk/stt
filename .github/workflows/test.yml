name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev
      - run: uv run python -m compileall -q server scripts tests
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: node tests/i18n.test.cjs
      - run: node tests/session_compat.test.cjs
      - run: node tests/edge.test.cjs

  windows-script-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse operational PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in @('scripts/start.ps1', 'scripts/stop.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell parser rejected $file : $($errors | Out-String)"
            }
          }
